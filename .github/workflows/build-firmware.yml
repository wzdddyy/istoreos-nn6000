name: Build iStoreOS NN6000 Firmware

on:
  workflow_dispatch:

env:
  ISTOREOS_BRANCH: istoreos-25.12
  TARGET_PROFILE: link_nn6000-v2

# 创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build NN6000 v2 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 释放磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo apt-get autoremove -y
          df -h /

      # 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ g++-multilib \
            flex bison gawk \
            libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-pip \
            rsync unzip zlib1g-dev \
            swig libelf-dev device-tree-compiler \
            clang ccache \
            git subversion mercurial \
            wget curl
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          df -h /

      # 检出补丁仓库
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches

      # 克隆 iStoreOS 源码
      - name: Clone iStoreOS source
        run: |
          git clone --depth=1 --branch ${ISTOREOS_BRANCH} \
            https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          git log --oneline -1
          df -h /

      # 缓存工具链
      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: |
            istoreos/staging_dir
            istoreos/build_dir
            istoreos/tmp
            ~/.ccache
          key: toolchain-qualcommax-ipq60xx-25.12-v1
          restore-keys: |
            toolchain-qualcommax-ipq60xx-25.12-

      # 应用设备补丁
      - name: Apply NN6000 device patches
        run: |
          cd istoreos
          bash ../patches/apply-patches.sh

      # 更新 feeds
      - name: Update and install feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 配置编译选项
      - name: Configure build
        run: |
          cd istoreos
          cat > .config << 'SEED'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y
          # CONFIG_PACKAGE_TAR_BZIP2 is not set
          # CONFIG_PACKAGE_TAR_XZ is not set
          # CONFIG_PACKAGE_TAR_ZSTD is not set
          SEED
          make defconfig

      # defconfig 后诊断 Web 组件选中状态（y=内置 m=模块 缺=未选）
      - name: Verify web packages
        run: |
          cd istoreos
          echo "==== 1. .config 中 Web 相关包状态 ===="
          for pkg in uhttpd uhttpd-mod-ubus rpcd rpcd-mod-file luci luci-base \
                     luci-app-store luci-lib-taskd taskd luci-app-dockerman \
                     nginx nginx-util luci-light luci-nginx curl tar mount-utils \
                     libuci-lua luci-lua-runtime; do
            line=$(grep -E "^CONFIG_PACKAGE_${pkg}=" .config || echo "(未选入)")
            echo "${pkg} : ${line}"
          done

          echo "==== 2. DEFAULT_PACKAGES 默认标记 ===="
          grep -E "^CONFIG_DEFAULT_" .config | grep -iE 'uhttpd|luci|rpcd|nginx|store' || echo "(无默认标记)"

          echo "==== 3. luci-app-store 依赖链递归分析（挖到根因符号） ===="
          python3 ../patches/scripts/diagnose-deps.py

          echo "==== 6. feeds 是否安装成功 ===="
          ls package/feeds/
          echo "store feed 包数量: $(ls package/feeds/store 2>/dev/null | wc -l)"
          echo "luci feed 包数量: $(ls package/feeds/luci 2>/dev/null | wc -l)"

          echo "==== 7. 构建系统选择的包管理器 ===="
          grep -E "CONFIG_USE_(APK|OPKG)" .config || echo "(未设置)"

          echo "==== 结论判定 ===="
          fail=0
          for pkg in uhttpd rpcd luci luci-base luci-app-store; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "OK: ${pkg}"
            else
              echo "FAIL: ${pkg} 未内置"
              fail=1
            fi
          done
          exit $fail

      # 下载源码
      - name: Download sources
        run: |
          cd istoreos
          make download -j$(nproc) V=s 2>&1 | tail -20 || true

      # 编译固件
      - name: Build firmware
        run: |
          cd istoreos
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR"
          # pipefail: make 失败时让步骤报错
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          ls -lh bin/targets/qualcommax/ipq60xx/

      # 整理输出文件
      - name: Prepare artifacts
        if: always()
        run: |
          cd istoreos
          mkdir -p artifacts/firmware artifacts/logs
          cp -r bin/targets/qualcommax/ipq60xx/* artifacts/firmware/ 2>/dev/null || true
          cp build.log .config artifacts/logs/ 2>/dev/null || true
          find artifacts/firmware -type f -exec ls -lh {} \; 2>/dev/null || echo "无固件文件"

      # 上传固件
      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-nn6000-v2-firmware
          path: istoreos/artifacts/firmware/
          retention-days: 14
          if-no-files-found: warn

      # 上传编译日志
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            istoreos/artifacts/logs/
            istoreos/build.log
          retention-days: 7
          if-no-files-found: warn

      # 生成固件信息
      - name: Generate firmware info
        if: success()
        id: info
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          cd istoreos
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%ci | cut -d' ' -f1)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT

      # 创建 Release
      - name: Create GitHub Release and Upload Firmware
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nn6000-v2-${{ steps.info.outputs.build_date }}
          name: iStoreOS NN6000 v2 Firmware - ${{ steps.info.outputs.build_date }}
          body: |
            ## iStoreOS Link NN6000 v2 固件

            - **目标设备**: Link NN6000 v2
            - **平台**: qualcommax/ipq60xx (ipq6000)
            - **iStoreOS 分支**: ${{ env.ISTOREOS_BRANCH }}
            - **iStoreOS 提交**: ${{ steps.info.outputs.commit_hash }} (${{ steps.info.outputs.commit_date }})
            - **编译日期**: ${{ steps.info.outputs.build_date }}

            | 文件 | 用途 |
            |------|------|
            | `*-sysupgrade.bin` | 已装 OpenWrt/iStoreOS 升级 |
            | `*-factory.bin` | 从原厂固件首次刷入 |
            | `*-initramfs-uImage.itb` | TFTP 启动测试，不写 Flash |

            非官方构建，刷写风险自负。
          files: |
            istoreos/artifacts/firmware/*-squashfs-sysupgrade.bin
            istoreos/artifacts/firmware/*-squashfs-factory.bin
            istoreos/artifacts/firmware/*-initramfs-uImage.itb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
