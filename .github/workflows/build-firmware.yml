name: Build iStoreOS NN6000 Firmware

on:
  workflow_dispatch:

env:
  ISTOREOS_BRANCH: istoreos-25.12
  TARGET_PROFILE: link_nn6000-v2

jobs:
  build:
    name: Build NN6000 v2 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # Step 0: 缓存工具链和 ccache（加速二次编译）
      # ============================================================
      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: |
            istoreos/staging_dir
            istoreos/build_dir
            istoreos/tmp
            ~/.ccache
          key: toolchain-qualcommax-ipq60xx-25.12-${{ hashFiles('istoreos/target/linux/qualcommax/**', 'istoreos/toolchain/**') }}
          restore-keys: |
            toolchain-qualcommax-ipq60xx-25.12-

      # ============================================================
      # Step 1: 释放磁盘空间
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== 释放磁盘空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo apt-get autoremove -y
          df -h /

      # ============================================================
      # Step 2: 安装编译依赖
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ g++-multilib \
            flex bison gawk \
            libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-pip \
            rsync unzip zlib1g-dev \
            swig libelf-dev device-tree-compiler \
            clang ccache \
            git subversion mercurial \
            wget curl
          # Python 兼容性：确保 python 命令可用
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true
          df -h /

      # ============================================================
      # Step 3: 检出本仓库（获取补丁文件和脚本）
      # ============================================================
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches

      # ============================================================
      # Step 4: 克隆 iStoreOS 25.12 源码
      # ============================================================
      - name: Clone iStoreOS source
        run: |
          echo "=== 克隆 iStoreOS ${ISTOREOS_BRANCH} ==="
          git clone --depth=1 --branch ${ISTOREOS_BRANCH} \
            https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          echo "最新提交:"
          git log --oneline -1
          df -h /

      # ============================================================
      # Step 5: 应用 NN6000 设备补丁
      # ============================================================
      - name: Apply NN6000 device patches
        run: |
          cd istoreos
          bash ../patches/apply-patches.sh

      # ============================================================
      # Step 6: 更新 feeds
      # ============================================================
      - name: Update and install feeds
        run: |
          cd istoreos
          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          echo "=== 安装 feeds ==="
          ./scripts/feeds install -a

      # ============================================================
      # Step 7: 配置编译选项
      # ============================================================
      - name: Configure build
        run: |
          cd istoreos
          echo "=== 生成 .config ==="
          # 写入种子配置（确保缩进正确，不能有多余空行）
          cat > .config << 'SEED'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y
          SEED
          # 自动解析依赖，填充默认值
          make defconfig
          echo "=== 最终配置 ==="
          grep -E 'CONFIG_TARGET|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_iStore|CONFIG_PACKAGE_ipq-wifi' .config || true

      # ============================================================
      # Step 8: 下载工具链和源码
      # ============================================================
      - name: Download sources
        run: |
          cd istoreos
          echo "=== 下载工具链和源码包 ==="
          make download -j$(nproc) V=s 2>&1 | tail -20 || true

      # ============================================================
      # Step 9: 编译固件
      # ============================================================
      - name: Build firmware
        run: |
          cd istoreos
          echo "=== 开始编译 ==="
          # 使用 ccache 加速
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR"
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -50
          echo "=== 编译结果 ==="
          ls -lh bin/targets/qualcommax/ipq60xx/ 2>/dev/null || echo "未找到输出文件"

      # ============================================================
      # Step 10: 整理输出文件
      # ============================================================
      - name: Prepare artifacts
        if: always()
        run: |
          cd istoreos
          mkdir -p artifacts/firmware
          mkdir -p artifacts/logs
          # 复制固件文件
          cp -r bin/targets/qualcommax/ipq60xx/* artifacts/firmware/ 2>/dev/null || true
          # 复制编译日志
          cp build.log artifacts/logs/ 2>/dev/null || true
          cp .config artifacts/logs/ 2>/dev/null || true
          # 显示文件列表
          echo "=== 生成的固件文件 ==="
          find artifacts/firmware -type f -exec ls -lh {} \; 2>/dev/null || echo "无固件文件"

      # ============================================================
      # Step 11: 上传固件 artifacts
      # ============================================================
      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-nn6000-v2-firmware
          path: istoreos/artifacts/firmware/
          retention-days: 14
          if-no-files-found: warn

      # ============================================================
      # Step 12: 上传编译日志
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            istoreos/artifacts/logs/
            istoreos/build.log
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # Step 13: 生成固件信息文件
      # ============================================================
      - name: Generate firmware info
        if: success()
        id: info
        run: |
          cd istoreos/artifacts/firmware
          # 获取编译日期
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          # 获取 iStoreOS 提交哈希
          cd ../../istoreos
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git log -1 --format=%ci | cut -d' ' -f1)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "=== 固件信息 ==="
          echo "编译日期: ${BUILD_DATE}"
          echo "iStoreOS 提交: ${COMMIT_HASH} (${COMMIT_DATE})"
          echo "目标设备: Link NN6000 v2 (qualcommax/ipq60xx)"

      # ============================================================
      # Step 14: 创建 GitHub Release 并上传固件
      # ============================================================
      - name: Create GitHub Release and Upload Firmware
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nn6000-v2-${{ steps.info.outputs.build_date }}
          name: iStoreOS NN6000 v2 Firmware - ${{ steps.info.outputs.build_date }}
          body: |
            ## iStoreOS Link NN6000 v2 固件

            ### 固件信息
            - **目标设备**: Link NN6000 v2
            - **平台**: Qualcomm Atheros ipq60xx (ipq6000)
            - **iStoreOS 分支**: ${{ env.ISTOREOS_BRANCH }}
            - **iStoreOS 提交**: ${{ steps.info.outputs.commit_hash }} (${{ steps.info.outputs.commit_date }})
            - **编译日期**: ${{ steps.info.outputs.build_date }}

            ### 固件文件说明
            | 文件 | 用途 |
            |------|------|
            | `*-squashfs-sysupgrade.bin` | 已安装 OpenWrt/iStoreOS 的设备通过 sysupgrade 升级 |
            | `*-squashfs-factory.bin` | 从原厂固件首次刷入 |
            | `*-initramfs-uImage.itb` | 通过 TFTP 启动测试，不刷写 Flash |

            ### 刷写步骤
            1. **首次测试**：下载 `initramfs-uImage.itb`，通过 TFTP 引导启动，确认网络/WiFi/USB 正常
            2. **正式刷写**：使用 `factory.bin` 从原厂固件刷入，或使用 `sysupgrade.bin` 从已安装的系统升级

            ### 注意事项
            - WiFi 驱动使用 `ipq-wifi-link_nn6000` 校准数据包
            - 存储为 eMMC，使用 `f2fs` 文件系统
            - **警告**：此固件非官方构建，刷写风险自负
          files: |
            istoreos/artifacts/firmware/*-squashfs-sysupgrade.bin
            istoreos/artifacts/firmware/*-squashfs-factory.bin
            istoreos/artifacts/firmware/*-initramfs-uImage.itb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
